# Unit prices used by the cost model, USD, checked 2026-11-08.
# AWS: eu-north-1 (Stockholm). Google Cloud: europe-north1 (Hamina, Finland).
#
# Every price comes from the provider's own pricing page or from the price data that page loads
# (AWS: the Price List files and b0.p.awsstatic.com meteredUnitMaps; Google: the region tables
# embedded in the pricing pages). `unit` decides how calc.py multiplies:
#   hour      price × hours in the month × quantity
#   gb_month  price × GB (or GiB) stored × quantity
#   gb        price × GB transferred or processed in the month
#   month     price × quantity
#   year      price / 12 × quantity
#   million   price × millions of requests/queries
#   thousand  price × thousands of requests

[meta]
checked = "2026-11-08"
hours_per_month = 730

