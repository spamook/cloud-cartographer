# Traefik: the ingress controller of the local setup (the cloud load balancers' role). It binds
# port 80 of the node, so everything is reachable on the Minikube IP. Its metrics are the
# "external traffic" numbers of the baseline: requests, latency and bytes per service.
deployment:
  replicas: 1
# only one pod can hold the node's port 80: replace the pod instead of starting a second one
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
ports:
  web:
    hostPort: 80
  websecure:
    expose:
      default: false
service:
  spec:
    type: ClusterIP
accessLog:
  enabled: true
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    # the default buckets (0.1, 0.3, 1.2, 5 s) are too coarse for latency percentiles of a fast app
    buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5"
    service:
      enabled: true
    serviceMonitor:
      enabled: true
# 1 core / 256 MiB was the breaking point of the first load test: at ~1,000 users (one open
# connection each) Traefik reached both limits, failed its probes and was restarted
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "2", memory: 512Mi}
